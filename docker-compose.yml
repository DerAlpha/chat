services:
  fluesterchat:
    build: .
    image: fluesterchat:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Hinter einem Reverse Proxy auf 1 setzen, sonst greifen die Rate-Limits nicht.
      TRUST_PROXY: "0"
      LOG_LEVEL: "info"
      ROOM_IDLE_TTL_HOURS: "168"
      UNCLAIMED_ROOM_TTL_HOURS: "24"
    volumes:
      - chat-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  chat-data:
