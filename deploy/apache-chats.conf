# ---------------------------------------------------------------------------
# Flüsterchat unter https://megamc.de/chats
#
# Diesen Block in den bestehenden <VirtualHost *:443> von megamc.de einfügen -
# und zwar VOR den vorhandenen ProxyPass-Regeln der übrigen Anwendung.
# Apache arbeitet ProxyPass-Regeln der Reihe nach ab; die erste passende
# gewinnt. Steht die Catch-all-Regel vorher, kommt hier nie etwas an.
#
# Benötigte Module (einmalig):
#   sudo a2enmod proxy proxy_http proxy_wstunnel rewrite
#   sudo systemctl reload apache2
#
# Am bestehenden Setup ändert sich sonst nichts: alle anderen Pfade laufen
# unverändert weiter dorthin, wo sie bisher hingelaufen sind.
# ---------------------------------------------------------------------------

# WebSocket muss zuerst kommen: die HTTP-Regel weiter unten würde das
# Protokoll-Upgrade sonst als gewöhnliche Anfrage weiterreichen, und der
# Chat bliebe stumm.
RewriteEngine On
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteCond %{HTTP:Connection} upgrade [NC]
RewriteRule ^/?chats/ws$ "ws://127.0.0.1:8123/chats/ws" [P,L]

# "/chats" ohne Schrägstrich auf "/chats/" ziehen. Die Seite lädt ihre
# Dateien relativ; ohne den Schrägstrich zeigten die Verweise ins Leere.
# Bewusst als RewriteRule und nicht als RedirectMatch: eine vorhandene
# Catch-all-Regel "ProxyPass /" greift früher als mod_alias und würde die
# Umleitung sonst verschlucken. Der Ausdruck ist exakt verankert und trifft
# daher kein "/chatsammlung".
RewriteRule ^/?chats$ /chats/ [R=302,L]

# Der abschließende Schrägstrich ist Absicht: "ProxyPass /chats" würde als
# reiner Präfixvergleich auch "/chatsammlung" einfangen.
ProxyPass        /chats/ http://127.0.0.1:8123/chats/ connectiontimeout=5 timeout=3600
ProxyPassReverse /chats/ http://127.0.0.1:8123/chats/

# Die App hängt hinter einem Reverse Proxy - sie soll die echte Client-IP
# sehen, damit ihre Rate-Limits nicht alle Besucher in einen Topf werfen.
# (Dazu in der Unit TRUST_PROXY=1 setzen.)
RequestHeader set X-Forwarded-Proto "https"
# Und was der Besucher an X-Forwarded-For mitbringt, fliegt vorher raus:
# mod_proxy haengt die echte Adresse nur an, statt sie zu ersetzen. Ohne diese
# Zeile stuende vorne, was sich der Absender ausgedacht hat.
RequestHeader unset X-Forwarded-For
