<!doctype html>
<html lang="de">
<meta charset="utf-8">
<title>Flüsterchat – Chatten ohne Anmeldung</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="description" content="Ende-zu-Ende verschlüsselter Chat für zwei – ohne Anmeldung, ohne Konto. Ein Einmal-Code genügt.">
<!-- Zwei Angaben, damit der Balken beim Laden schon stimmt. Danach setzt
     applyTheme() den Wert passend zur gewaehlten Einstellung. -->
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1319" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flüsterchat">
<!-- Die Symbole liegen in img/ und nicht in icons/: viele Apache-Installationen
     bringen von Haus aus ein "Alias /icons/" auf ihr eigenes Symbolverzeichnis
     mit und würden unseren Ordner damit verdecken. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon.svg" type="image/svg+xml">
<!-- Fuer Browser ohne SVG-Favicon. Ohne diese Zeile fragen sie /favicon.ico
     im Wurzelverzeichnis der Domain an - unter einem Unterpfad steht dort
     die Marke der Nachbarseite. -->
<link rel="icon" href="img/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/app.js"></script>

<svg class="sprite" aria-hidden="true" focusable="false">
  <!--
    Die Bildmarke, wie sie auch als Favicon und App-Symbol dient (img/icon.svg) -
    nur ohne die farbige Platte, denn die bringt .logo schon mit. Die Farben
    stehen bewusst an den Formen und nicht im Stilblatt: eine Marke ist keine
    Beschriftung, die die Farbe wechselt.
  -->
  <!--
    Der Ausschnitt sitzt eng an der Blase (sie reicht von 96,138 bis 454,422 -
    die Spitze mitgerechnet). Die farbige Platte bringt .logo mit; noch einen
    Rand aus der Datei mitzuschleppen liesse die Marke darin verloren wirken.
  -->
  <symbol id="i-logo" viewBox="84 126 382 308">
    <path d="M96 138h320a38 38 0 0 1 38 38v148a38 38 0 0 1-38 38H222l-80 60v-60h-46a38 38 0 0 1-38-38V176a38 38 0 0 1 38-38z" fill="#fff"/>
    <text x="256" y="286" fill="#2f6df6"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
          font-size="118" font-weight="700" letter-spacing="-2"
          text-anchor="middle" textLength="276" lengthAdjust="spacingAndGlyphs">psst...</text>
  </symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="m4 17 4.5-4.5a2 2 0 0 1 2.8 0L16 17M14.5 15.5l1.7-1.7a2 2 0 0 1 2.8 0L21 16"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.5"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M4 12 20 4l-7 16-2.5-6.5L4 12Z"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 13 4.5 4.5L19 7"/></symbol>
  <symbol id="i-check-double" viewBox="0 0 24 24"><path d="m2 13 4 4 8.5-9M11 17l1 1 9.5-10"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 3v13M8 7l4-4 4 4"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6"/><path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5-11-6.5Z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M8 11l4 4 4-4"/><path d="M5 20h14"/></symbol>
  <symbol id="i-reply" viewBox="0 0 24 24"><path d="M9 8 4 12l5 4"/><path d="M4 12h9a6 6 0 0 1 6 6v2"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4l10-10a2.5 2.5 0 0 0-3.5-3.5L4 16.5V20Z"/></symbol>
  <symbol id="i-warning" viewBox="0 0 24 24"><path d="M12 4 2.5 20h19L12 4Z"/><path d="M12 10v4.5M12 17.5v.5"/></symbol>
  <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9.5h3L11.5 6v12L7 14.5H4a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1Z"/><path d="M15.2 9.4a3.6 3.6 0 0 1 0 5.2M18 6.8a7.2 7.2 0 0 1 0 10.4"/></symbol>
  <symbol id="i-sound-off" viewBox="0 0 24 24"><path d="M4 9.5h3L11.5 6v12L7 14.5H4a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1Z"/><path d="m16 10 4 4M20 10l-4 4"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6Z"/><path d="M10 19a2 2 0 0 0 4 0"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 2.5 15.3 0 18M12 3c-2.5 2.7-2.5 15.3 0 18"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a4 4 0 0 0 5.7 0l2.6-2.6a4 4 0 1 0-5.7-5.7L11 6.3"/><path d="M14 11a4 4 0 0 0-5.7 0l-2.6 2.6a4 4 0 1 0 5.7 5.7l1.6-1.6"/></symbol>
  <symbol id="i-qr" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM19 19h2M14 21h1M20 14h1"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.5v.5"/></symbol>
  <symbol id="i-gif" viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M10 9.5a2.5 2.5 0 1 0 0 5h1v-2M13.8 9.5v5M17 14.5v-5h3.2M17 12h2.6"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 5.2a3.5 3.5 0 0 1 0 5.6M17.5 14.2A6.5 6.5 0 0 1 21.5 20"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><path d="M7 3.5 9.5 4l1.2 4-2 1.6a12 12 0 0 0 5.7 5.7l1.6-2 4 1.2.5 2.5a2 2 0 0 1-2 2.5C10.8 19.5 4.5 13.2 4.5 5.5a2 2 0 0 1 2.5-2Z"/></symbol>
  <symbol id="i-phone-off" viewBox="0 0 24 24"><path d="M2.5 15.5c2-2.6 5.4-4.2 9.5-4.2s7.5 1.6 9.5 4.2l-2.3 2.4-3.3-1.4-.3-2.4a15 15 0 0 0-7.2 0l-.3 2.4-3.3 1.4Z"/><path d="M3 3l18 18"/></symbol>
  <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="6" width="12" height="12" rx="2.5"/><path d="m15 11 5-3v8l-5-3Z"/></symbol>
  <symbol id="i-video-off" viewBox="0 0 24 24"><path d="M9 6h3.5a2.5 2.5 0 0 1 2.5 2.5V11l5-3v8l-5-3"/><path d="M3 3l18 18"/><path d="M15 15v.5A2.5 2.5 0 0 1 12.5 18h-7A2.5 2.5 0 0 1 3 15.5v-7A2.5 2.5 0 0 1 5.5 6"/></symbol>
  <symbol id="i-mic-off" viewBox="0 0 24 24"><path d="M9 5.8A3 3 0 0 1 15 6v5m-1.6 2.4A3 3 0 0 1 9 11v-1"/><path d="M5 11a7 7 0 0 0 10.3 6.2M19 11a7 7 0 0 1-.6 2.8M12 18v3"/><path d="M3 3l18 18"/></symbol>
  <symbol id="i-flip" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 8.7"/><path d="M20 4v5h-5"/><path d="M20 12a8 8 0 0 1-13.7 5.6L4 15.3"/><path d="M4 20v-5h5"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 5 6v6c0 4.3 2.9 7.9 7 9 4.1-1.1 7-4.7 7-9V6l-7-3Z"/><path d="m9 12 2 2 4-4"/></symbol>
</svg>

<main id="app">

  <!-- ------------------------------------------------------------ Start -->
  <section class="screen screen--scroll" id="screen-start" aria-labelledby="start-title">
    <div class="screen__inner">
      <div class="hero">
        <div class="logo logo--mark" aria-hidden="true"><svg><use href="#i-logo"/></svg></div>
        <h1 id="start-title" data-i18n="appName">Flüsterchat</h1>
        <p class="hero__tagline" data-i18n="tagline"></p>
      </div>

      <div class="stack">
        <button class="btn btn--primary btn--lg" id="btn-start" type="button">
          <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>
          <span data-i18n="startChat"></span>
        </button>
        <button class="btn btn--ghost btn--lg" id="btn-group" type="button">
          <svg class="icon" aria-hidden="true"><use href="#i-users"/></svg>
          <span data-i18n="startGroup"></span>
        </button>
        <button class="btn btn--ghost btn--lg" id="btn-join" type="button">
          <svg class="icon" aria-hidden="true"><use href="#i-link"/></svg>
          <span data-i18n="joinChat"></span>
        </button>
        <p class="muted center" data-i18n="startHint"></p>
      </div>

      <section class="chats" id="chats-section" hidden aria-labelledby="chats-title">
        <h2 class="section-title" id="chats-title" data-i18n="yourChats">Deine Chats</h2>
        <ul class="chat-list" id="chat-list"></ul>
      </section>

      <!-- Die Stichpunkte ziehen am Rechner in den Platzhalter nebenan um. -->
      <div class="slot" id="slot-start">
        <ul class="features" id="features">
          <li>
            <svg class="icon" aria-hidden="true"><use href="#i-lock"/></svg>
            <div><strong data-i18n="featureE2e"></strong><span data-i18n="featureE2eText"></span></div>
          </li>
          <li>
            <svg class="icon" aria-hidden="true"><use href="#i-users"/></svg>
            <div><strong data-i18n="featureNoAccount"></strong><span data-i18n="featureNoAccountText"></span></div>
          </li>
          <li>
            <svg class="icon" aria-hidden="true"><use href="#i-image"/></svg>
            <div><strong data-i18n="featurePhotos"></strong><span data-i18n="featurePhotosText"></span></div>
          </li>
        </ul>
      </div>

      <footer class="page-footer">
        <p class="muted center" data-i18n="privacyNote"></p>
        <div class="footer-actions">
          <button class="btn btn--chip" id="btn-lang" type="button">
            <svg class="icon" aria-hidden="true"><use href="#i-globe"/></svg><span id="lang-label">DE</span>
          </button>
          <button class="btn btn--chip" id="btn-theme" type="button">
            <svg class="icon" aria-hidden="true"><use href="#i-sun"/></svg><span id="theme-label" data-i18n="themeAuto"></span>
          </button>
          <button class="btn btn--chip" id="btn-about" type="button">
            <svg class="icon" aria-hidden="true"><use href="#i-info"/></svg><span data-i18n="about"></span>
          </button>
        </div>
      </footer>
    </div>
  </section>

  <!-- ----------------------------------------------------------- Einladen -->
  <section class="screen screen--scroll" id="screen-invite" hidden aria-labelledby="invite-title">
    <div class="screen__inner">
      <button class="btn btn--icon back" id="invite-back" type="button" data-i18n-attr="aria-label:back">
        <svg class="icon" aria-hidden="true"><use href="#i-back"/></svg>
      </button>

      <h2 id="invite-title" data-i18n="yourCode"></h2>
      <p class="muted center" data-i18n="codeHint"></p>

      <output class="code-display" id="code-display" aria-live="polite"></output>

      <div class="qr-frame" id="qr-frame" aria-hidden="true"></div>
      <p class="muted center small" data-i18n="scanHint"></p>

      <div class="stack">
        <button class="btn btn--primary" id="btn-share" type="button" hidden>
          <svg class="icon" aria-hidden="true"><use href="#i-share"/></svg><span data-i18n="shareLink"></span>
        </button>
        <button class="btn" id="btn-copy-link" type="button">
          <svg class="icon" aria-hidden="true"><use href="#i-link"/></svg><span data-i18n="copyLink"></span>
        </button>
        <button class="btn btn--ghost" id="btn-copy-code" type="button">
          <svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg><span data-i18n="copyCode"></span>
        </button>
      </div>

      <p class="waiting" id="invite-status">
        <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span data-i18n="waitingForPeer"></span>
      </p>
      <button class="btn btn--primary" id="btn-to-chat" type="button" hidden data-i18n="toChat"></button>
    </div>
  </section>

  <!-- ------------------------------------------------- Gruppe: die Codes -->
  <!-- Ein Code je Person, jeder genau einmal einloesbar. Wer einen davon
       weitergibt, gibt genau einen Platz weiter - nicht die Gruppe. -->
  <section class="screen screen--scroll" id="screen-group" hidden aria-labelledby="group-title">
    <div class="screen__inner">
      <button class="btn btn--icon back" id="group-back" type="button" data-i18n-attr="aria-label:back">
        <svg class="icon" aria-hidden="true"><use href="#i-back"/></svg>
      </button>

      <h2 id="group-title" data-i18n="groupCodes"></h2>
      <p class="muted center" data-i18n="groupCodesHint"></p>
      <p class="muted center small" id="group-progress" aria-live="polite"></p>

      <ul class="invite-list" id="group-codes"></ul>

      <button class="btn btn--primary" id="btn-group-to-chat" type="button" data-i18n="toChat"></button>
    </div>
  </section>

  <!-- ---------------------------------------------------------- Beitreten -->
  <section class="screen screen--scroll" id="screen-join" hidden aria-labelledby="join-title">
    <div class="screen__inner">
      <button class="btn btn--icon back" id="join-back" type="button" data-i18n-attr="aria-label:back">
        <svg class="icon" aria-hidden="true"><use href="#i-back"/></svg>
      </button>

      <h2 id="join-title" data-i18n="enterCode"></h2>
      <p class="muted center" data-i18n="enterCodeHint"></p>

      <form id="join-form" novalidate>
        <label class="visually-hidden" for="code-input" data-i18n="enterCode"></label>
        <input class="code-input" id="code-input" type="text" inputmode="text"
               autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false"
               maxlength="14" data-i18n-attr="placeholder:codePlaceholder">
        <p class="field-error" id="join-error" role="alert" hidden></p>
        <div class="stack">
          <button class="btn btn--primary btn--lg" id="btn-do-join" type="submit" disabled data-i18n="join"></button>
          <button class="btn btn--ghost" id="btn-paste" type="button">
            <svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg><span data-i18n="paste"></span>
          </button>
        </div>
      </form>
    </div>
  </section>

  <!-- --------------------------------------------------------------- Chat -->
  <section class="screen screen--chat" id="screen-chat" hidden>
    <header class="chat-header">
      <button class="btn btn--icon" id="chat-back" type="button" data-i18n-attr="aria-label:back">
        <svg class="icon" aria-hidden="true"><use href="#i-back"/></svg>
      </button>
      <div class="avatar" id="peer-avatar" aria-hidden="true">?</div>
      <div class="chat-header__text">
        <strong id="peer-name"></strong>
        <span class="chat-header__status" id="peer-status"></span>
      </div>
      <button class="btn btn--icon" id="btn-call-audio" type="button" data-i18n-attr="aria-label:callAudio" hidden>
        <svg class="icon" aria-hidden="true"><use href="#i-phone"/></svg>
      </button>
      <button class="btn btn--icon" id="btn-call-video" type="button" data-i18n-attr="aria-label:callVideo" hidden>
        <svg class="icon" aria-hidden="true"><use href="#i-video"/></svg>
      </button>
      <button class="btn btn--icon" id="chat-menu" type="button" data-i18n-attr="aria-label:menu" aria-haspopup="true">
        <svg class="icon" aria-hidden="true"><use href="#i-more"/></svg>
      </button>
    </header>

    <div class="banner" id="banner" hidden role="status"></div>

    <div class="messages" id="messages" role="log" tabindex="0"></div>

    <button class="jump-down" id="jump-down" type="button" hidden data-i18n-attr="aria-label:jumpToLatest">
      <svg class="icon" aria-hidden="true"><use href="#i-chevron-down"/></svg>
      <span class="badge" id="jump-badge" hidden></span>
    </button>

    <div class="composer-wrap">
      <div class="reply-preview" id="reply-preview" hidden>
        <div class="reply-preview__body">
          <span class="reply-preview__label" data-i18n="replyingTo"></span>
          <span class="reply-preview__text" id="reply-preview-text"></span>
        </div>
        <button class="btn btn--icon" id="reply-cancel" type="button" data-i18n-attr="aria-label:cancel">
          <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
        </button>
      </div>

      <div class="attachments" id="attachments" hidden></div>

      <div class="recorder" id="recorder" hidden>
        <button class="btn btn--icon danger" id="rec-cancel" type="button" data-i18n-attr="aria-label:discard">
          <svg class="icon" aria-hidden="true"><use href="#i-trash"/></svg>
        </button>
        <span class="rec-dot" aria-hidden="true"></span>
        <span class="rec-time" id="rec-time">0:00</span>
        <div class="rec-level"><i id="rec-level-bar"></i></div>
        <button class="btn btn--icon btn--send" id="rec-send" type="button" data-i18n-attr="aria-label:stopAndSend">
          <svg class="icon" aria-hidden="true"><use href="#i-send"/></svg>
        </button>
      </div>

      <form class="composer" id="composer">
        <button class="btn btn--icon" id="btn-attach" type="button" data-i18n-attr="aria-label:attach">
          <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>
        </button>
        <label class="visually-hidden" for="message-input" data-i18n="messagePlaceholder"></label>
        <textarea class="composer__input" id="message-input" rows="1" enterkeyhint="send"
                  autocomplete="off" autocapitalize="sentences" data-i18n-attr="placeholder:messagePlaceholder"></textarea>
        <button class="btn btn--icon" id="btn-record" type="button" data-i18n-attr="aria-label:recordVoice">
          <svg class="icon" aria-hidden="true"><use href="#i-mic"/></svg>
        </button>
        <button class="btn btn--icon btn--send" id="btn-send" type="submit" data-i18n-attr="aria-label:send" hidden>
          <svg class="icon" aria-hidden="true"><use href="#i-send"/></svg>
        </button>
      </form>
    </div>

    <input class="visually-hidden" id="file-gallery" type="file" accept="image/*" multiple tabindex="-1">
    <input class="visually-hidden" id="file-camera" type="file" accept="image/*" capture="environment" tabindex="-1">
    <input class="visually-hidden" id="file-any" type="file" tabindex="-1">
  </section>

  <!-- ---------------------------------------- Platzhalter neben der Liste -->
  <section class="screen screen--empty" id="screen-empty" hidden aria-labelledby="empty-title">
    <div class="empty">
      <div class="logo logo--mark" aria-hidden="true"><svg><use href="#i-logo"/></svg></div>
      <h2 id="empty-title" data-i18n="appName">Flüsterchat</h2>
      <p class="muted" data-i18n="tagline"></p>
      <div class="slot" id="slot-empty"></div>
      <p class="muted small" data-i18n="emptyHint"></p>
    </div>
  </section>

  <!-- -------------------------------------------------------------- Fehler -->
  <section class="screen screen--scroll" id="screen-error" hidden aria-labelledby="error-title">
    <div class="screen__inner center-block">
      <div class="logo logo--warn" aria-hidden="true"><svg><use href="#i-warning"/></svg></div>
      <h2 id="error-title" data-i18n="errorTitle"></h2>
      <p class="muted center" id="error-text"></p>
      <div class="stack">
        <button class="btn btn--primary" id="error-retry" type="button" hidden data-i18n="tryAgain"></button>
        <button class="btn btn--ghost" id="error-home" type="button" data-i18n="startOver"></button>
      </div>
    </div>
  </section>
</main>

<!-- ---------------------------------------------------------------- Anruf -->
<div class="call" id="call" hidden role="dialog" aria-modal="true" aria-labelledby="call-name">
  <div class="call__stage">
    <video class="call__remote" id="call-remote" autoplay playsinline></video>
    <div class="call__person" id="call-person">
      <div class="avatar avatar--xl" id="call-avatar" aria-hidden="true">?</div>
      <strong id="call-name"></strong>
      <span class="call__state" id="call-state"></span>
    </div>
    <video class="call__local" id="call-local" autoplay playsinline muted hidden></video>
    <div class="call__bar">
      <span class="call__timer" id="call-timer" hidden></span>
      <button class="call__safety" id="call-safety" type="button" hidden data-i18n-attr="aria-label:callSafety">
        <svg class="icon" aria-hidden="true"><use href="#i-shield"/></svg>
        <span id="call-safety-code"></span>
      </button>
    </div>
    <p class="call__hint" id="call-hint" hidden></p>
  </div>

  <div class="call__actions" id="call-actions">
    <button class="call__btn" id="call-mute" type="button">
      <svg class="icon" aria-hidden="true"><use href="#i-mic"/></svg>
      <span data-i18n="callMute"></span>
    </button>
    <button class="call__btn" id="call-camera" type="button">
      <svg class="icon" aria-hidden="true"><use href="#i-video"/></svg>
      <span data-i18n="callCamera"></span>
    </button>
    <button class="call__btn" id="call-flip" type="button" hidden>
      <svg class="icon" aria-hidden="true"><use href="#i-flip"/></svg>
      <span data-i18n="callFlip"></span>
    </button>
    <button class="call__btn call__btn--hangup" id="call-hangup" type="button">
      <svg class="icon" aria-hidden="true"><use href="#i-phone-off"/></svg>
      <span data-i18n="callHangUp"></span>
    </button>
  </div>

  <div class="call__actions call__actions--incoming" id="call-incoming" hidden>
    <button class="call__btn call__btn--hangup" id="call-decline" type="button">
      <svg class="icon" aria-hidden="true"><use href="#i-phone-off"/></svg>
      <span data-i18n="callDecline"></span>
    </button>
    <button class="call__btn call__btn--accept" id="call-accept" type="button">
      <svg class="icon" aria-hidden="true"><use href="#i-phone"/></svg>
      <span data-i18n="callAccept"></span>
    </button>
  </div>
</div>

<!-- ------------------------------------------------------------- Overlays -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet__backdrop" id="sheet-backdrop"></div>
  <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <button class="sheet__grip" id="sheet-grip" type="button" data-i18n-attr="aria-label:close"></button>
    <h3 class="sheet__title" id="sheet-title"></h3>
    <div class="sheet__body" id="sheet-body"></div>
  </div>
</div>

<div class="lightbox" id="lightbox" hidden>
  <div class="lightbox__bar">
    <button class="btn btn--icon" id="lightbox-close" type="button" data-i18n-attr="aria-label:close">
      <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
    </button>
    <span class="lightbox__caption" id="lightbox-caption"></span>
    <a class="btn btn--icon" id="lightbox-download" download data-i18n-attr="aria-label:saveImage">
      <svg class="icon" aria-hidden="true"><use href="#i-download"/></svg>
    </a>
  </div>
  <img id="lightbox-image" alt="">
</div>

<!-- --------------------------------------------------------- Aktualisieren -->
<!-- Liegt über allem und lässt sich nicht wegklicken: eine veraltete Kopie
     der App kann Nachrichten falsch darstellen oder gar nicht erst laden. -->
<div class="update" id="update" hidden role="alertdialog" aria-modal="true"
     aria-labelledby="update-title" aria-describedby="update-text">
  <div class="update__box">
    <div class="logo" aria-hidden="true"><svg><use href="#i-download"/></svg></div>
    <h2 id="update-title" data-i18n="updateTitle"></h2>
    <p id="update-text" data-i18n="updateText"></p>
    <button class="btn btn--primary btn--lg" id="update-now" type="button">
      <svg class="icon" aria-hidden="true"><use href="#i-download"/></svg>
      <span data-i18n="updateNow"></span>
    </button>
    <p class="muted small" id="update-hint" data-i18n="updateHint"></p>
  </div>
</div>

<p class="visually-hidden" id="live-region" aria-live="polite" aria-atomic="true"></p>
<output class="toast" id="toast" hidden aria-live="polite"></output>
<div class="busy" id="busy" hidden role="status"><span class="spinner" aria-hidden="true"></span><span id="busy-text"></span></div>
</html>
