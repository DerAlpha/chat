; Anhänge dürfen bis 12 MB gross sein - der Rahmen darum braucht etwas Luft.
upload_max_filesize = 16M
post_max_size = 16M

; Beim Abholen neuer Nachrichten bleibt eine Anfrage bis zu 20 Sekunden liegen.
; Der Hoster kann diesen Wert nach unten begrenzen; die App merkt das selbst
; und wartet dann entsprechend kürzer.
max_execution_time = 45
